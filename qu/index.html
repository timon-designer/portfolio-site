<script>
var DATA = JSON.parse(document.getElementById('data').textContent);
document.getElementById('date').textContent = DATA.date + '（北京时间）';
var list = document.getElementById('list');
DATA.groups.forEach(function (g) {
  var sec = document.createElement('section');
  sec.className = 'group';
  var h = document.createElement('h2');
  h.textContent = g.name;
  sec.appendChild(h);
  g.items.forEach(function (it) {
    var d = document.createElement('div');
    d.className = 'item';
    var t = document.createElement('div');
    t.className = 't';
    t.textContent = it.t;
    if (it.tag) {
      var s = document.createElement('span');
      s.className = 'tag';
      s.textContent = it.tag;
      t.appendChild(s);
    }
    var b = document.createElement('button');
    b.textContent = '复制口令';
    var tip = document.createElement('div');
    tip.className = 'g';
    tip.textContent = it.g;
    b.addEventListener('click', function () { copyCode(it.code, b, tip); });
    d.appendChild(t); d.appendChild(b); d.appendChild(tip);
    sec.appendChild(d);
  });
  list.appendChild(sec);
});
function copyCode(text, btn, tip) {
  function done() {
    btn.textContent = '已复制 ✓ 打开App';
    btn.classList.add('ok');
    tip.style.display = 'block';
  }
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, fallback);
  } else { fallback(); }
}
</script>
